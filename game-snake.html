<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake Retro - Show Up</title>
  <!-- Google Font Retro 8-Bit -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-purple: #a855f7;
      --bg-dark: #0a0518;
      --card-bg: rgba(26, 11, 46, 0.85);
    }

    /* BACKGROUND RETRO SYNTHWAVE GRID */
    body {
      font-family: 'Press Start 2P', monospace;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(rgba(255, 0, 127, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* EFEK LAYAR CRT SCANLINE (EFEK TV JADUL) */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
    }

    .header {
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      max-width: 900px;
    }
    .btn-back {
      color: var(--neon-cyan);
      text-decoration: none;
      font-size: 11px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    
    .game-container {
      width: 90%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
      text-align: center;
      margin-top: 10px;
      backdrop-filter: blur(8px);
    }
    
    .score-board {
      font-size: 14px;
      color: var(--neon-cyan);
      margin-bottom: 20px;
      text-shadow: 0 0 10px var(--neon-cyan);
      letter-spacing: 1px;
    }

    /* CANVAS DENGAN GLOW NEON */
    canvas {
      background-color: #05020c;
      border: 3px solid var(--neon-cyan);
      border-radius: 8px;
      box-shadow: 0 0 15px var(--neon-cyan);
      display: block;
      margin: 0 auto;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: white;
      border: none;
      padding: 14px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--neon-pink);
      transition: transform 0.2s;
      margin-top: 20px;
    }
    .btn-primary:hover { transform: scale(1.05); }

    .instructions {
      color: #94a3b8;
      font-size: 9px;
      margin-top: 20px;
      line-height: 1.8;
      font-family: 'Segoe UI', sans-serif;
    }

    /* SCREEN GAME OVER */
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 5, 24, 0.95);
      padding: 30px 20px;
      border-radius: 16px;
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 30px var(--neon-pink);
      text-align: center;
      z-index: 10;
      width: 80%;
    }
    .canvas-wrapper { position: relative; display: inline-block; }
  </style>
</head>
<body>

  <!-- Efek Layar CRT -->
  <div class="crt-overlay"></div>

  <div class="header">
    <a href="rasyad.html" class="btn-back">← KELUAR</a>
    <span style="font-size: 12px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);">🐍 SNAKE 8-BIT</span>
  </div>

  <div class="game-container">
    <div class="score-board">SKOR: <span id="score">0</span></div>
    
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <!-- Pop up Game Over -->
      <div id="game-over">
        <h2 style="color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 16px; margin-top: 0;">GAME OVER</h2>
        <p style="font-size: 10px; color: #ffffff; margin: 20px 0;">SKOR AKHIR: <span id="final-score" style="color:var(--neon-cyan);">0</span></p>
        <button class="btn-primary" onclick="resetGame()">MAIN LAGI 🔄</button>
      </div>
    </div>

    <p class="instructions">
      <b>KONTROL:</b> Gunakan tombol arah panah <b>(▲ ▼ ◄ ►)</b> untuk mengendalikan ular neon!
    </p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const boxSize = 20; 
    let score = 0;
    let snake = [];
    let apple = {};
    let dx = boxSize; 
    let dy = 0;
    let gameLoop;
    let changingDirection = false;

    // --- SYSTEM SOUND EFFECTS (Web Audio API) ---
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playEatSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square'; // Suara khas 8-bit retro
      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playGameOverSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    function playTurnSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);

      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    // --- GAME LOGIC ---
    function initGame() {
      snake = [
        {x: 200, y: 200},
        {x: 180, y: 200},
        {x: 160, y: 200}
      ];
      score = 0;
      dx = boxSize;
      dy = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('game-over').style.display = 'none';
      spawnApple();
      
      if(gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(main, 90); // Sedikit lebih cepat khas arcade
    }

    function main() {
      if (hasGameEnded()) {
        playGameOverSound();
        document.getElementById('game-over').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        clearInterval(gameLoop);
        return;
      }
      
      changingDirection = false;
      clearCanvas();
      drawApple();
      moveSnake();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = "#05020c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // DENGAN EFEK KEPALA NEON BERPENDAR
    function drawSnake() {
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = "#00f3ff"; // Kepala Cyan Neon
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#00f3ff";
        } else {
          ctx.fillStyle = "#a855f7"; // Badan Purple
          ctx.shadowBlur = 0;
        }
        ctx.strokeStyle = "#05020c";
        ctx.fillRect(part.x, part.y, boxSize, boxSize);
        ctx.strokeRect(part.x, part.y, boxSize, boxSize);
      });
      ctx.shadowBlur = 0; // Reset shadow
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head); 

      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        playEatSound();
        spawnApple(); 
      } else {
        snake.pop(); 
      }
    }

    function spawnApple() {
      apple.x = Math.floor(Math.random() * (canvas.width / boxSize)) * boxSize;
      apple.y = Math.floor(Math.random() * (canvas.height / boxSize)) * boxSize;
      
      snake.forEach(function isAppleOnSnake(part) {
        if (part.x === apple.x && part.y === apple.y) spawnApple();
      });
    }

    // APEL MERAH PINK NEON
    function drawApple() {
      ctx.fillStyle = "#ff007f"; 
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#ff007f";
      ctx.fillRect(apple.x, apple.y, boxSize, boxSize);
      ctx.shadowBlur = 0;
    }

    function hasGameEnded() {
      for (let i = 4; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
      }
      const hitLeftWall = snake[0].x < 0;
      const hitRightWall = snake[0].x >= canvas.width;
      const hitTopWall = snake[0].y < 0;
      const hitBottomWall = snake[0].y >= canvas.height;

      return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
    }

    document.addEventListener("keydown", changeDirection);
    function changeDirection(event) {
      if (changingDirection) return; 
      
      const LEFT_KEY = 37;
      const RIGHT_KEY = 39;
      const UP_KEY = 38;
      const DOWN_KEY = 40;

      const keyPressed = event.keyCode;
      const goingUp = dy === -boxSize;
      const goingDown = dy === boxSize;
      const goingRight = dx === boxSize;
      const goingLeft = dx === -boxSize;

      let turned = false;
      if (keyPressed === LEFT_KEY && !goingRight) { dx = -boxSize; dy = 0; turned = true; }
      if (keyPressed === UP_KEY && !goingDown) { dx = 0; dy = -boxSize; turned = true; }
      if (keyPressed === RIGHT_KEY && !goingLeft) { dx = boxSize; dy = 0; turned = true; }
      if (keyPressed === DOWN_KEY && !goingUp) { dx = 0; dy = boxSize; turned = true; }
      
      if (turned) {
        changingDirection = true;
        playTurnSound();
      }

      if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
          event.preventDefault();
      }
    }

    function resetGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
